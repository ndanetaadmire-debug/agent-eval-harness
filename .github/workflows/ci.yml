name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples && ruff format --check src tests examples
      - run: mypy
      - run: pytest --cov --cov-fail-under=90

  # The harness gating itself: run the example suite against the committed baseline,
  # exactly as a team would gate their own agent on every PR.
  agent-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Evaluate agent against baseline
        run: |
          evalh run examples/cases/support.json \
            --agent examples.demo_agent:make_agent \
            --baseline examples/baseline.json \
            --out eval-report.json \
            --md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
