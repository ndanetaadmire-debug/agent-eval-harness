[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Regression testing for LLM agents: golden cases, trajectory and policy scorers, repeated runs for non-determinism, baseline comparison and a CI gate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Admire T. Ndaneta" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
evalh = "evalh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalh"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["evalh"]

[tool.coverage.run]
source = ["evalh"]
branch = true
